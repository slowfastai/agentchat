[workspace]
resolver = "2"
members = [
    "protocol",
    "core",
    "adapters/claude-code",
    "server",
    "bin",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
